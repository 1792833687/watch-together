<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>小雨滴滴答</title>
<link rel="stylesheet" href="styles.css?v=42">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Josefin+Sans:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<!-- ====== LOBBY ====== -->
<div class="screen active" id="lobby" aria-label="大厅">
  <div class="lobby-card">
    <div class="lobby-icon"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg></div>
    <h1 class="lobby-title">小雨滴滴答</h1>
    <p class="lobby-sub">和朋友同步看视频 · 创建房间分享链接即可加入</p>
    <div class="nick-row">
      <input type="text" id="nick-input" class="input" placeholder="你的昵称" maxlength="12" autocomplete="off" aria-label="昵称">
      <button id="nick-save" class="btn btn-secondary btn-sm">保存</button>
    </div>
    <button id="create-btn" class="btn btn-primary" style="width:100%;justify-content:center">创建房间</button>
    <div class="join-row">
      <span class="divider">或加入已有房间</span>
      <div class="input-group">
        <input type="text" id="join-input" class="input" placeholder="输入4位房间号" autocomplete="off" aria-label="房间号">
        <button id="join-btn" class="btn btn-primary btn-sm">加入</button>
      </div>
    </div>
    <p id="lobby-err" class="lobby-err"></p>
    <p class="lobby-footer">v42 · Cinema Architecture</p>
  </div>
</div>

<!-- ====== WATCH ROOM ====== -->
<div class="screen" id="watch" aria-label="观影室">

  <!-- Top Bar -->
  <div class="topbar">
    <div class="topbar-left">
      <span class="conn-dot idle" id="conn-dot" title="连接状态"></span>
      <span class="badge" id="room-badge">---</span>
      <span class="status" id="status">就绪</span>
      <button class="btn btn-sm btn-secondary hidden" id="retry-conn" title="重新连接">重试</button>
    </div>
    <div class="topbar-center">
      <span class="peer-presence hidden" id="peer-presence">
        <span class="peer-dot online" id="peer-dot"></span>
        <span id="peer-name">--</span>
        <span class="peer-video" id="peer-video"></span>
      </span>
      <span class="online-count" id="online-count">👤 1 人在线</span>
    </div>
    <div class="topbar-right">
      <button class="theme-toggle" id="theme-toggle" title="切换主题" aria-label="切换明暗主题">
        <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <button class="btn btn-sm btn-secondary" id="change-room-btn">换房</button>
      <button class="btn btn-sm btn-secondary" id="panel-toggle-btn" title="折叠面板">◀</button>
      <button class="btn btn-sm btn-danger" id="leave-btn">离开</button>
    </div>
  </div>

  <!-- Body: Video + Panel -->
  <div class="body">

    <!-- Video Stage -->
    <div class="video-stage" id="video-stage" aria-label="视频播放区">

      <!-- Placeholder -->
      <div class="welcome" id="placeholder">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="0.8"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
        <p class="welcome-title">准备就绪</p>
        <p class="welcome-hint">粘贴链接或搜索片源开始观看</p>
        <div class="welcome-share">
          <p>分享房间链接给朋友</p>
          <button class="btn btn-primary btn-sm" id="copy-link-btn">📋 复制链接</button>
        </div>
      </div>

      <!-- Loading -->
      <div class="load-overlay hidden" id="load-overlay">
        <div class="load-spinner"></div>
        <span class="load-txt" id="load-txt">加载中...</span>
      </div>

      <!-- Video Error -->
      <div class="video-err-overlay hidden" id="video-err-overlay">
        <p class="video-err-txt" id="video-err-txt"></p>
        <div class="video-err-actions" id="video-err-actions"></div>
      </div>

      <!-- Player -->
      <video id="player" playsinline webkit-playsinline x5-video-player-type="h5" x5-video-orientation="portraint"></video>
      <canvas id="shared-screen"></canvas>

      <!-- Video Controls -->
      <div class="vid-controls hidden" id="vid-controls">
        <div class="vid-seek-wrap">
          <span class="vid-time" id="vid-cur">0:00</span>
          <input type="range" class="vid-seek" id="vid-seek" min="0" max="100" value="0" step="0.1" aria-label="播放进度">
          <span class="vid-time" id="vid-dur">0:00</span>
          <button class="sync-btn" id="sync-btn" title="手动同步进度" aria-label="手动同步">⟳</button>
        </div>
        <button class="vid-ctrl-btn" id="pip-btn" title="画中画" aria-label="画中画">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="12" y="8" width="10" height="8" rx="1"/><rect x="2" y="4" width="16" height="14" rx="2"/></svg>
        </button>
        <button class="vid-ctrl-btn" id="clear-btn" title="停止" aria-label="停止播放">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="6" width="12" height="12"/></svg>
        </button>
        <button class="vid-ctrl-btn" id="playpause-btn" title="暂停/播放" aria-label="暂停或播放">
          <svg class="pp-play" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          <svg class="pp-pause" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="none" style="display:none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
        </button>
        <div class="vid-ctrl-spacer"></div>
        <div class="vol-group">
          <span class="vol-icon">🔊</span>
          <input type="range" class="vol-slider" id="vol-slider" min="0" max="1" value="1" step="0.05" aria-label="音量">
        </div>
        <div class="speed-group">
          <span class="speed-opt" data-speed="0.75">0.75x</span>
          <span class="speed-opt active" data-speed="1">1x</span>
          <span class="speed-opt" data-speed="1.25">1.25x</span>
          <span class="speed-opt" data-speed="1.5">1.5x</span>
          <span class="speed-opt" data-speed="2">2x</span>
        </div>
        <button class="vid-ctrl-btn" id="fullscreen-btn" title="全屏" aria-label="切换全屏">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
        </button>
      </div>
    </div>

    <!-- Desktop Panel (also used as mobile bottom panel) -->
    <aside class="panel-desktop" id="panel-desk" aria-label="控制面板">

      <!-- Mobile Tab Switcher (only visible ≤768px) -->
      <div class="mobile-panel-tabs" id="mobile-panel-tabs">
        <button class="mpt-tab active" data-mpt="search">🔍 搜索</button>
        <button class="mpt-tab" data-mpt="chat">💬 聊天</button>
        <button class="mpt-tab" data-mpt="list">📋 列表</button>
        <button class="mpt-tab" data-mpt="members">👥</button>
        <button class="mobile-sync-btn" id="mobile-sync-btn" title="手动同步">⟳ 同步</button>
      </div>

      <section class="pnl-sec mpt-section mpt-search" id="pnl-search">
        <h3 class="pnl-sec-title">搜索片源</h3>
        <div class="search-row">
          <input type="text" id="url-input" class="input" placeholder="影片名 或 视频链接" aria-label="搜索">
          <button class="btn btn-primary btn-sm" id="url-btn">搜索</button>
        </div>
        <div class="search-history hidden" id="search-history"></div>
        <div class="sk-list hidden" id="search-sk">
          <div class="sk-item"></div><div class="sk-item"></div><div class="sk-item"></div>
        </div>
        <div class="search-results hidden" id="search-res"></div>
        <div class="empty-state hidden" id="search-empty"><p>未找到片源<br>试试其他关键词</p></div>
        <div class="ep-list hidden" id="ep-list"></div>
      </section>

      <section class="pnl-sec mpt-section mpt-list" id="pnl-playlist">
        <div class="pnl-sec-head">
          <h3 class="pnl-sec-title">播放列表</h3>
          <button class="btn btn-sm btn-secondary" id="playlist-clear">清空</button>
        </div>
        <div id="playlist"></div>
        <div class="empty-state" id="playlist-empty"><p>播放过的视频<br>会出现在这里</p></div>
      </section>

      <section class="pnl-sec mpt-section mpt-members" id="pnl-members">
        <h3 class="pnl-sec-title">在线成员</h3>
        <div id="member-list"></div>
      </section>

      <section class="pnl-sec pnl-sec-chat mpt-section mpt-chat" id="pnl-chat">
        <h3 class="pnl-sec-title">聊天</h3>
        <div class="msg-list" id="msg-list"></div>
        <div class="empty-state" id="chat-empty"><p>发送第一条消息~</p></div>
        <div class="emoji-picker" id="emoji-picker"></div>
        <div class="chat-row">
          <button class="btn btn-sm btn-secondary" id="emoji-btn">😊</button>
          <input type="text" id="chat-input" class="input" placeholder="输入消息..." aria-label="消息">
          <button class="btn btn-primary btn-sm" id="chat-btn">发送</button>
        </div>
      </section>
    </aside>

  </div>

</div>

<!-- Room Switch Overlay -->
<div class="room-switch-overlay hidden" id="room-switch-overlay">
  <div class="room-switch-card">
    <h3>切换房间</h3>
    <input type="text" id="change-room-input" class="input" placeholder="输入新房间号" aria-label="新房间号">
    <div class="room-switch-actions">
      <button class="btn btn-sm btn-secondary" id="change-room-cancel">取消</button>
      <button class="btn btn-sm btn-primary" id="change-room-go">进入</button>
    </div>
  </div>
</div>

<!-- Toast Container -->
<div id="toast-container"></div>

<!-- Scripts -->
<script src="lib/mqtt.min.js"></script>
<script src="lib/hls.min.js"></script>
<script src="app.js?v=42"></script>
</body>
</html>
